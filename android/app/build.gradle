apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"

import java.util.Properties

react {
    nodeExecutableAndArgs = ["node", "--max-old-space-size=4096"]

    extraPackagerArgs = ["--max-workers", "1"]

    autolinkLibrariesWithApp()
}

def ensureCodegenStub = { String cmakeFilePath, String targetName ->
    def cmakeFile = file(cmakeFilePath)
    def dummyCppFile = new File(cmakeFile.parentFile, "dummy.cpp")

    cmakeFile.parentFile.mkdirs()

    if (!dummyCppFile.exists()) {
        dummyCppFile.text = """extern "C" void ${targetName}_stub() {}"""
    }

    cmakeFile.text = """cmake_minimum_required(VERSION 3.13)
project(${targetName})
add_library(${targetName} SHARED dummy.cpp)
"""
}

tasks.register("prepareMissingCodegenJni") {
    doLast {
        ensureCodegenStub(
            "${rootDir}/../node_modules/@react-native-community/blur/android/build/generated/source/codegen/jni/CMakeLists.txt",
            "react_codegen_rnblurview"
        )

        ensureCodegenStub(
            "${rootDir}/../node_modules/@react-native-community/geolocation/android/build/generated/source/codegen/jni/CMakeLists.txt",
            "react_codegen_RNCGeolocationSpec"
        )
    }
}

afterEvaluate {
    tasks.matching { task ->
        task.name == "preBuild" ||
        task.name.startsWith("configureCMake") ||
        task.name.startsWith("externalNativeBuildClean")
    }.configureEach {
        dependsOn(tasks.named("prepareMissingCodegenJni"))
    }

    tasks.matching { task ->
        task.name.startsWith("externalNativeBuildClean")
    }.configureEach {
        enabled = false
    }

    tasks.matching { task ->
        task.name == "clean"
    }.configureEach {
        delete(layout.buildDirectory)
        delete(file("${projectDir}/.cxx"))
    }
}

def enableProguardInReleaseBuilds = false

def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

def keystoreProperties = new Properties()

def keystorePropertiesFile = rootProject.file("key.properties")

def isReleaseBuildRequested = gradle.startParameter.taskNames.any {
    taskName -> taskName.toLowerCase().contains("release")
}

if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    /*
     * IMPORTANT:
     * This must match the package expected by the
     * React Native generated Android code.
     */
    namespace "com.ResidenceConnect.myapp"

    /*
     * React Native 0.82+ / Android Gradle Plugin
     * requires BuildConfig generation for the
     * generated ReactNativeApplicationEntryPoint.
     */
    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId "com.ResidenceConnect.myapp"

        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion

        versionCode 19
        versionName "1.2.4"
    }

    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }

        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(
                    keystoreProperties["storeFile"]
                )

                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }

        release {
            if (isReleaseBuildRequested && !keystorePropertiesFile.exists()) {
                throw new GradleException(
                    "Missing android/key.properties. Release builds must be signed with your upload keystore."
                )
            }

            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }

            minifyEnabled true
            shrinkResources true

            proguardFiles(
                getDefaultProguardFile(
                    "proguard-android-optimize.txt"
                ),
                "proguard-rules.pro"
            )
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    implementation "com.ttlock:ttlock:3.5.7"

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}