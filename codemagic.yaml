workflows:

  ios-release:

    name: iOS Release Build

    max_build_duration: 120

    environment:

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.residenceconnect.myapp

      vars:
        XCODE_WORKSPACE: "MyGate.xcworkspace"
        XCODE_SCHEME: "MyGate"
        NODE_OPTIONS: "--max_old_space_size=8192"

      node: latest
      xcode: latest
      cocoapods: default

    integrations:
      app_store_connect: Codemagic Key

    scripts:

      # ---------------------------------------------------------
      # 1. Install JavaScript dependencies
      # ---------------------------------------------------------
      - name: Install dependencies
        script: |
          npm ci

      # ---------------------------------------------------------
      # 2. Clean iOS and install Pods
      # ---------------------------------------------------------
      # Podfile should contain:
      #
      # $RNFirebaseDisableSPM = true
      #
      # pod 'FirebaseCore'
      # pod 'FirebaseMessaging'
      #
      # Do NOT use:
      # use_frameworks! :linkage => :static
      #
      - name: Clean iOS & Install Pods
        script: |
          set -e

          cd ios

          echo "===== CLEANING IOS ====="

          rm -rf Pods
          rm -rf build
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          rm -rf ~/Library/Caches/CocoaPods

          rm -f Podfile.lock

          echo "===== POD DEINTEGRATE ====="
          pod deintegrate || true

          echo "===== POD REPOSITORY UPDATE ====="
          pod repo update

          echo "===== POD INSTALL ====="
          pod install --repo-update

          echo "===== POD INSTALL COMPLETED ====="

      # ---------------------------------------------------------
      # 3. Verify Firebase installation
      # ---------------------------------------------------------
      - name: Verify Firebase Pods
        script: |
          set -e

          echo "======================================"
          echo "FIREBASE NPM PACKAGES"
          echo "======================================"

          npm list @react-native-firebase/app \
            @react-native-firebase/messaging || true

          echo ""
          echo "======================================"
          echo "FIREBASE PODS"
          echo "======================================"

          grep -E \
            "FirebaseCore|FirebaseMessaging|RNFBApp|RNFBMessaging" \
            ios/Podfile.lock || true

          echo ""
          echo "======================================"
          echo "FIREBASE DIRECTORIES"
          echo "======================================"

          ls -la ios/Pods/FirebaseCore || true
          ls -la ios/Pods/FirebaseMessaging || true

          echo ""
          echo "======================================"
          echo "FIREBASE PUBLIC HEADERS"
          echo "======================================"

          ls -la ios/Pods/Headers/Public/FirebaseCore || true
          ls -la ios/Pods/Headers/Public/FirebaseMessaging || true
          ls -la ios/Pods/Headers/Public/RNFBApp || true
          ls -la ios/Pods/Headers/Public/RNFBMessaging || true

      # ---------------------------------------------------------
      # 4. Show Podfile.lock
      # ---------------------------------------------------------
      - name: Show Podfile.lock
        script: |
          echo "===== PODFILE.LOCK ====="
          cat ios/Podfile.lock

      # ---------------------------------------------------------
      # 5. Verify TTLock
      # ---------------------------------------------------------
      - name: Show TTLock Pods
        script: |
          echo "===== TTLOCK PODS ====="

          grep -i "TTLock" ios/Podfile.lock || true

          grep -i "react-native-ttlock" ios/Podfile.lock || true

      # ---------------------------------------------------------
      # 6. Show React Native configuration
      # ---------------------------------------------------------
      - name: Show React Native configuration
        script: |
          echo "===== PACKAGE.JSON ====="

          node -p "require('./package.json').dependencies"

          echo ""
          echo "===== PODFILE.PROPERTIES ====="

          cat ios/Podfile.properties.json || true

          echo ""
          echo "===== PODFILE ====="

          cat ios/Podfile

      # ---------------------------------------------------------
      # 7. Verify Hermes
      # ---------------------------------------------------------
      - name: Verify Hermes
        script: |
          echo "===== HERMES ====="

          grep -i hermes ios/Podfile.lock || true

      # ---------------------------------------------------------
      # 8. Patch fmt
      # ---------------------------------------------------------
      - name: Patch fmt for Xcode
        script: |
          set -e

          FILE="ios/Pods/fmt/include/fmt/base.h"

          if [ -f "$FILE" ]; then

            echo "===== FMT BEFORE PATCH ====="

            grep -n "FMT_USE_CONSTEVAL" "$FILE" || true

            perl -0pi -e \
              's/#\s*define\s+FMT_USE_CONSTEVAL\s+1/#define FMT_USE_CONSTEVAL 0/g' \
              "$FILE"

            sed -i '' \
              's/#define FMT_USE_CONSTEVAL 1/#define FMT_USE_CONSTEVAL 0/g' \
              "$FILE" || true

            sed -i '' \
              's/#define FMT_USE_CONSTEVAL FMT_HAS_CONSTEVAL/#define FMT_USE_CONSTEVAL 0/g' \
              "$FILE" || true

            echo "===== FMT AFTER PATCH ====="

            grep -n "FMT_USE_CONSTEVAL" "$FILE" || true

          else

            echo "fmt/base.h not found. Skipping fmt patch."

          fi

      # ---------------------------------------------------------
      # 9. Show fmt section
      # ---------------------------------------------------------
      - name: Show fmt section
        script: |
          if [ -f "ios/Pods/fmt/include/fmt/base.h" ]; then
            sed -n '100,140p' ios/Pods/fmt/include/fmt/base.h
          fi

      # ---------------------------------------------------------
      # 10. Verify workspace
      # ---------------------------------------------------------
      - name: Verify workspace
        script: |
          echo "===== IOS DIRECTORY ====="
          ls -la ios

          echo ""
          echo "===== WORKSPACE ====="

          if [ -d "ios/$XCODE_WORKSPACE" ]; then
            echo "Workspace found:"
            ls -la "ios/$XCODE_WORKSPACE"
          else
            echo "ERROR: Workspace not found!"
            exit 1
          fi

      # ---------------------------------------------------------
      # 11. Verify Firebase files
      # ---------------------------------------------------------
      - name: Verify Firebase configuration files
        script: |
          set -e

          echo "===== GOOGLE SERVICE INFO ====="

          if [ -f "ios/GoogleService-Info.plist" ]; then
            echo "GoogleService-Info.plist found."
          else
            echo "ERROR: GoogleService-Info.plist not found."
            exit 1
          fi

          echo ""
          echo "===== ENTITLEMENTS ====="

          if [ -f "ios/MyGate/MyGate.entitlements" ]; then
            cat ios/MyGate/MyGate.entitlements
          else
            echo "WARNING: MyGate.entitlements not found."
          fi

      # ---------------------------------------------------------
      # 12. Set up code signing
      # ---------------------------------------------------------
      - name: Set up code signing
        script: |
          set -e

          cd ios

          xcode-project use-profiles

      # ---------------------------------------------------------
      # 13. Check Xcode
      # ---------------------------------------------------------
      - name: Check Build Environment
        script: |
          echo "===== XCODE VERSION ====="

          xcodebuild -version

          echo ""
          echo "===== AVAILABLE SDKS ====="

          xcodebuild -showsdks

      # ---------------------------------------------------------
      # 14. Check fmt version
      # ---------------------------------------------------------
      - name: Check fmt Version
        script: |
          echo "===== FMT VERSION ====="

          grep -A 2 "fmt (" ios/Podfile.lock || true

      # ---------------------------------------------------------
      # 15. Verify Release build
      # ---------------------------------------------------------
      - name: Verify Release Build
        script: |
          set -o pipefail

          cd ios

          echo "======================================"
          echo "STARTING RELEASE BUILD"
          echo "======================================"

          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            build \
            2>&1 | tee ../release-build.log

          BUILD_STATUS=${PIPESTATUS[0]}

          echo ""
          echo "======================================"
          echo "RELEASE BUILD ERRORS"
          echo "======================================"

          grep -iE \
            "error:|fatal error:|SwiftDriver|unable to resolve module|No such module" \
            ../release-build.log || true

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo ""
            echo "======================================"
            echo "RELEASE BUILD FAILED"
            echo "======================================"

            exit "$BUILD_STATUS"
          fi

      # ---------------------------------------------------------
      # 16. Increment build number
      # ---------------------------------------------------------
      - name: Increment build number
        script: |
          cd ios

          agvtool new-version -all "$BUILD_NUMBER"

      # ---------------------------------------------------------
      # 17. Build IPA
      # ---------------------------------------------------------
      - name: Build IPA
        script: |
          set -o pipefail

          echo "======================================"
          echo "BUILDING IPA"
          echo "======================================"

          xcode-project build-ipa \
            --workspace "ios/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --verbose \
            2>&1 | tee build.log

          BUILD_STATUS=${PIPESTATUS[0]}

          echo ""
          echo "======================================"
          echo "IPA BUILD ERRORS"
          echo "======================================"

          grep -iE \
            "error:|fatal error:|SwiftDriver|unable to resolve module|No such module" \
            build.log || true

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo ""
            echo "IPA BUILD FAILED"

            exit "$BUILD_STATUS"
          fi

    artifacts:

      - ios/Podfile.lock
      - build/ios/ipa/*.ipa
      - build.log
      - release-build.log
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/Archives/**/*.xcarchive

    publishing:

      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers

      email:
        recipients:
          - your-email@gmail.com