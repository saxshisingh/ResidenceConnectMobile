workflows:

  ios-release:

    name: iOS Release Build

    max_build_duration: 120

    environment:

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.residenceconnect.myapp

      vars:
        XCODE_WORKSPACE: "MyGate.xcworkspace"
        XCODE_SCHEME: "MyGate"
        NODE_OPTIONS: "--max_old_space_size=8192"

      node: latest
      xcode: latest
      cocoapods: default

    integrations:
      app_store_connect: Codemagic Key

    scripts:

      # =========================================================
      # 1. Install JavaScript dependencies
      # =========================================================

      - name: Install dependencies
        script: |
          set -e

          echo "===== INSTALLING NPM DEPENDENCIES ====="

          npm ci

      # =========================================================
      # 2. Clean iOS + Install CocoaPods
      # =========================================================

      - name: Clean iOS & Install Pods
        script: |
          set -e

          echo "======================================"
          echo "CLEANING IOS"
          echo "======================================"

          cd ios

          rm -rf Pods
          rm -rf build
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          rm -rf ~/Library/Caches/CocoaPods

          # Regenerate once because Firebase Pod configuration changed.
          rm -f Podfile.lock

          echo "===== POD DEINTEGRATE ====="

          pod deintegrate || true

          echo "===== POD REPOSITORY UPDATE ====="

          pod repo update

          echo "===== POD INSTALL ====="

          pod install --repo-update

          echo "===== POD INSTALL COMPLETED ====="

      # =========================================================
      # 3. Verify Firebase dependencies
      # =========================================================

      - name: Verify Firebase Pods
        script: |
          set -e

          echo "======================================"
          echo "FIREBASE NPM PACKAGES"
          echo "======================================"

          cd ..

          npm list \
            @react-native-firebase/app \
            @react-native-firebase/messaging || true

          echo ""
          echo "======================================"
          echo "FIREBASE PODS IN PODFILE.LOCK"
          echo "======================================"

          grep -E \
            "FirebaseCore|FirebaseMessaging|RNFBApp|RNFBMessaging" \
            ios/Podfile.lock || true

          echo ""
          echo "======================================"
          echo "FIREBASE DIRECTORIES"
          echo "======================================"

          ls -la ios/Pods/FirebaseCore || true
          ls -la ios/Pods/FirebaseMessaging || true

          echo ""
          echo "======================================"
          echo "FIREBASE PUBLIC HEADERS"
          echo "======================================"

          ls -la ios/Pods/Headers/Public/FirebaseCore || true
          ls -la ios/Pods/Headers/Public/FirebaseMessaging || true
          ls -la ios/Pods/Headers/Public/RNFBApp || true
          ls -la ios/Pods/Headers/Public/RNFBMessaging || true

      # =========================================================
      # 4. Verify Firebase module maps
      # =========================================================

      - name: Verify Firebase Messaging Module
        script: |
          set -e

          echo "======================================"
          echo "FIREBASE MODULE MAPS"
          echo "======================================"

          echo ""
          echo "===== FirebaseCore module maps ====="

          find ios/Pods \
            -iname "*FirebaseCore*.modulemap" \
            -print || true

          echo ""
          echo "===== FirebaseMessaging module maps ====="

          find ios/Pods \
            -iname "*FirebaseMessaging*.modulemap" \
            -print || true

          echo ""
          echo "===== All Firebase module maps ====="

          find ios/Pods \
            -iname "*.modulemap" \
            | grep -i firebase \
            || true

          echo ""
          echo "===== FirebaseMessaging Support Files ====="

          ls -la \
            ios/Pods/Target\ Support\ Files/FirebaseMessaging \
            2>/dev/null || true

          echo ""
          echo "===== FirebaseMessaging Generated xcconfig ====="

          cat \
            ios/Pods/Target\ Support\ Files/FirebaseMessaging/FirebaseMessaging.debug.xcconfig \
            2>/dev/null || true

          echo ""
          echo "===== FirebaseMessaging Release xcconfig ====="

          cat \
            ios/Pods/Target\ Support\ Files/FirebaseMessaging/FirebaseMessaging.release.xcconfig \
            2>/dev/null || true

      # =========================================================
      # 5. Show complete Podfile.lock
      # =========================================================

      - name: Show Podfile.lock
        script: |
          echo "======================================"
          echo "PODFILE.LOCK"
          echo "======================================"

          cat ios/Podfile.lock

      # =========================================================
      # 6. Verify TTLock
      # =========================================================

      - name: Verify TTLock Pods
        script: |
          echo "======================================"
          echo "TTLOCK PODS"
          echo "======================================"

          grep -i "TTLock" ios/Podfile.lock || true

          grep -i "react-native-ttlock" ios/Podfile.lock || true

      # =========================================================
      # 7. Verify React Native configuration
      # =========================================================

      - name: Verify React Native Configuration
        script: |
          echo "======================================"
          echo "PACKAGE.JSON DEPENDENCIES"
          echo "======================================"

          node -p "require('./package.json').dependencies"

          echo ""
          echo "======================================"
          echo "PODFILE.PROPERTIES.JSON"
          echo "======================================"

          cat ios/Podfile.properties.json || true

          echo ""
          echo "======================================"
          echo "PODFILE"
          echo "======================================"

          cat ios/Podfile

      # =========================================================
      # 8. Verify Hermes
      # =========================================================

      - name: Verify Hermes
        script: |
          echo "======================================"
          echo "HERMES"
          echo "======================================"

          grep -i hermes ios/Podfile.lock || true

      # =========================================================
      # 9. Patch fmt for Xcode
      # =========================================================

      - name: Patch fmt for Xcode
        script: |
          set -e

          FILE="ios/Pods/fmt/include/fmt/base.h"

          if [ -f "$FILE" ]; then

            echo "======================================"
            echo "FMT BEFORE PATCH"
            echo "======================================"

            grep -n "FMT_USE_CONSTEVAL" "$FILE" || true

            perl -0pi -e \
              's/#\s*define\s+FMT_USE_CONSTEVAL\s+1/#define FMT_USE_CONSTEVAL 0/g' \
              "$FILE"

            sed -i '' \
              's/#define FMT_USE_CONSTEVAL 1/#define FMT_USE_CONSTEVAL 0/g' \
              "$FILE" || true

            sed -i '' \
              's/#define FMT_USE_CONSTEVAL FMT_HAS_CONSTEVAL/#define FMT_USE_CONSTEVAL 0/g' \
              "$FILE" || true

            echo ""
            echo "======================================"
            echo "FMT AFTER PATCH"
            echo "======================================"

            grep -n "FMT_USE_CONSTEVAL" "$FILE" || true

          else

            echo "fmt/base.h not found. Skipping fmt patch."

          fi

      # =========================================================
      # 10. Show fmt section
      # =========================================================

      - name: Show fmt section
        script: |
          if [ -f "ios/Pods/fmt/include/fmt/base.h" ]; then

            echo "======================================"
            echo "FMT SECTION"
            echo "======================================"

            sed -n '100,140p' ios/Pods/fmt/include/fmt/base.h

          fi

      # =========================================================
      # 11. Verify workspace
      # =========================================================

      - name: Verify Workspace
        script: |
          set -e

          echo "======================================"
          echo "IOS DIRECTORY"
          echo "======================================"

          ls -la ios

          echo ""
          echo "======================================"
          echo "WORKSPACE"
          echo "======================================"

          if [ -d "ios/$XCODE_WORKSPACE" ]; then

            echo "Workspace found:"
            ls -la "ios/$XCODE_WORKSPACE"

          else

            echo "ERROR: Workspace not found:"
            echo "ios/$XCODE_WORKSPACE"

            exit 1

          fi

      # =========================================================
      # 12. Verify Firebase configuration files
      # =========================================================

      - name: Verify Firebase Configuration
        script: |
          set -e

          echo "======================================"
          echo "GOOGLE SERVICE INFO"
          echo "======================================"

          if [ -f "ios/GoogleService-Info.plist" ]; then

            echo "GoogleService-Info.plist found."

          else

            echo "ERROR: GoogleService-Info.plist not found."

            exit 1

          fi

          echo ""
          echo "======================================"
          echo "ENTITLEMENTS"
          echo "======================================"

          if [ -f "ios/MyGate/MyGate.entitlements" ]; then

            cat ios/MyGate/MyGate.entitlements

          else

            echo "WARNING: MyGate.entitlements not found."

          fi

      # =========================================================
      # 13. Set up code signing
      # =========================================================

      - name: Set up code signing
        script: |
          set -e

          cd ios

          xcode-project use-profiles

      # =========================================================
      # 14. Check Xcode environment
      # =========================================================

      - name: Check Build Environment
        script: |
          echo "======================================"
          echo "XCODE VERSION"
          echo "======================================"

          xcodebuild -version

          echo ""
          echo "======================================"
          echo "AVAILABLE SDKS"
          echo "======================================"

          xcodebuild -showsdks

      # =========================================================
      # 15. Check fmt version
      # =========================================================

      - name: Check fmt Version
        script: |
          echo "======================================"
          echo "FMT VERSION"
          echo "======================================"

          grep -A 2 "fmt (" ios/Podfile.lock || true

      # =========================================================
      # 16. Verify Release Build
      # =========================================================

      - name: Verify Release Build
        script: |
          set -o pipefail

          cd ios

          echo "======================================"
          echo "STARTING RELEASE BUILD"
          echo "======================================"

          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            build \
            2>&1 | tee ../release-build.log

          BUILD_STATUS=${PIPESTATUS[0]}

          echo ""
          echo "======================================"
          echo "RELEASE BUILD ERRORS"
          echo "======================================"

          grep -iE \
            "error:|fatal error:|SwiftDriver|unable to resolve module|No such module" \
            ../release-build.log || true

          if [ "$BUILD_STATUS" -ne 0 ]; then

            echo ""
            echo "======================================"
            echo "RELEASE BUILD FAILED"
            echo "======================================"

            exit "$BUILD_STATUS"

          fi

          echo ""
          echo "======================================"
          echo "RELEASE BUILD SUCCESSFUL"
          echo "======================================"

      # =========================================================
      # 17. Increment build number
      # =========================================================

      - name: Increment Build Number
        script: |
          set -e

          cd ios

          agvtool new-version -all "$BUILD_NUMBER"

      # =========================================================
      # 18. Build IPA
      # =========================================================

      - name: Build IPA
        script: |
          set -o pipefail

          echo "======================================"
          echo "BUILDING IPA"
          echo "======================================"

          xcode-project build-ipa \
            --workspace "ios/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --verbose \
            2>&1 | tee build.log

          BUILD_STATUS=${PIPESTATUS[0]}

          echo ""
          echo "======================================"
          echo "IPA BUILD ERRORS"
          echo "======================================"

          grep -iE \
            "error:|fatal error:|SwiftDriver|unable to resolve module|No such module" \
            build.log || true

          if [ "$BUILD_STATUS" -ne 0 ]; then

            echo ""
            echo "======================================"
            echo "IPA BUILD FAILED"
            echo "======================================"

            exit "$BUILD_STATUS"

          fi

          echo ""
          echo "======================================"
          echo "IPA BUILD SUCCESSFUL"
          echo "======================================"

    artifacts:

      - ios/Podfile.lock
      - build/ios/ipa/*.ipa
      - build.log
      - release-build.log
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/Archives/**/*.xcarchive

    publishing:

      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers

      email:
        recipients:
          - your-email@gmail.com